name: Sync Barça Match Stats (+4h CDMX)

on:
  schedule:
    # Se ejecuta 2 veces al día (17:00 y 21:00 tiempo CDMX / 23:00 y 03:00 UTC)
    # coincidiendo exactamente con la ventana de +4h después de los partidos
    - cron: '0 3,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-match-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled match sync engine
        run: |
          python data_pipeline/scheduled_match_sync.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add barca_analytics.db
          if ! git diff --staged --quiet; then
            echo "Changes detected in barca_analytics.db. Committing and pushing to main..."
            git commit -m "Auto-sync: official match stats and opponent form (+4h CDMX window)"
            git push origin main
          else
            echo "No match updates required at this time."
          fi
