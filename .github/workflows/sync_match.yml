name: Sync Barça Match Stats (+4h CDMX)

on:
  schedule:
    # Se ejecuta solo en las ventanas posteriores a los partidos (17:00 y 21:00 tiempo CDMX)
    # en lugar de ejecutarse cada hora innecesariamente.
    - cron: '15 2 7 9 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-match-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled match sync engine
        run: |
          python data_pipeline/scheduled_match_sync.py

      - name: Commit and push changes if updated
        run: |
          git add barca_analytics.db .github/workflows/sync_match.yml
          if ! git diff --staged --quiet; then
            echo "Changes detected. Committing and pushing to main..."
            git commit -m "Auto-sync: update stats and dynamically schedule next match cron"
            git push origin main
          else
            echo "No match updates required at this time."
          fi
